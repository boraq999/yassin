<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسعار العملات - مصرف ليبيا المركزي</title>
    <style>
        :root {
            --primary: #1a5f7a;
            --accent: #c9ae5d;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            width: 350px;
            text-align: center;
            border-top: 8px solid var(--primary);
        }

        h2 {
            color: var(--primary);
            margin-bottom: 25px;
            font-size: 1.5rem;
        }

        .rate-item {
            background: #f8f9fa;
            margin: 10px 0;
            padding: 15px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .label {
            color: #555;
            font-weight: bold;
        }

        .price {
            color: var(--primary);
            font-family: monospace;
            font-size: 1.2rem;
            font-weight: 800;
        }

        .avg {
            background: #e3f2fd;
            border: 1px solid #bbdefb;
        }

        .status {
            font-size: 0.8rem;
            margin-top: 20px;
            color: #888;
        }

        .currency-selector {
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .currency-selector label {
            display: block;
            margin-bottom: 10px;
            color: var(--primary);
            font-weight: bold;
            font-size: 0.95rem;
        }

        #currency-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--primary);
            border-radius: 8px;
            background: white;
            color: var(--primary);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        #currency-select:hover {
            border-color: var(--accent);
            box-shadow: 0 2px 8px rgba(26, 95, 122, 0.2);
        }

        #currency-select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(201, 174, 93, 0.2);
        }

        #currency-name {
            color: var(--accent);
            font-size: 1.3rem;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }


        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>أسعار العملات (CBL)</h2>

        <div class="currency-selector">
            <label for="currency-select">اختر العملة:</label>
            <select id="currency-select">
                <option value="الدولار الأمريكي" selected>الدولار الأمريكي (USD)</option>
                <option value="اليورو">اليورو (EUR)</option>
                <option value="الجنيه الاسترليني">الجنيه الإسترليني (GBP)</option>
                <option value="الدولار الكندي">الدولار الكندي (CAD)</option>
                <option value="الدولار الاسترالي">الدولار الأسترالي (AUD)</option>
                <option value="الفرنك السويسري">الفرنك السويسري (CHF)</option>
                <option value="الين الياباني">الين الياباني (JPY)</option>
                <option value="اليوان الصيني">اليوان الصيني (CNY)</option>
                <option value="الدينار التونسي">الدينار التونسي (TND)</option>
                <option value="الدرهم المغربي">الدرهم المغربي (MAD)</option>
                <option value="الجنيه المصري">الجنيه المصري (EGP)</option>
            </select>
        </div>

        <div id="loader-container">
            <div class="loader"></div>
            <p>جاري جلب البيانات من المصرف المركزي...</p>
        </div>

        <div id="data-container" style="display: none;">
            <h3 id="currency-name">الدولار الأمريكي</h3>
            <div class="rate-item">
                <span class="label">شراء:</span>
                <span class="price" id="buy">-</span>
            </div>
            <div class="rate-item">
                <span class="label">بيع:</span>
                <span class="price" id="sell">-</span>
            </div>
            <div class="rate-item avg">
                <span class="label">المتوسط:</span>
                <span class="price" id="avg">-</span>
            </div>
            <p class="status">المصدر: موقع مصرف ليبيا المركزي الرسمي</p>
            <p class="status" id="date"></p>
        </div>
    </div>

    <script src="script.js"></script>


</body>

</html>
