<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأسعار - مصرف ليبيا المركزي</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Tajawal:wght@400;500;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <!-- Dashboard Content -->
        <main class="dashboard">

            <div id="loader-container">
                <span class="loader"></span>
                <p>جاري تحديث البيانات...</p>
            </div>

            <div id="data-container" class="dashboard-grid" style="display: none;">

                <!-- Welcome Section (Right) -->
                <div class="welcome-section">
                    <div class="welcome-text">
                        <p>مرحباً بك في</p>
                        <h1>مُنصّة الأسعار</h1>
                    </div>
                    <div class="header-tools">
                        <div class="currency-selector-wrapper">
                            <select id="currency-select" class="premium-select">
                                <option value="الدولار الأمريكي">🇺🇸 الدولار الأمريكي</option>
                                <option value="اليورو">🇪🇺 اليورو</option>
                                <option value="الجنيه الاسترليني">🇬🇧 الجنيه الاسترليني</option>
                                <option value="الدولار الكندي">🇨🇦 الدولار الكندي</option>
                                <option value="الفرنك السويسري">🇨🇭 الفرنك السويسري</option>
                                <option value="الين الياباني">🇯🇵 الين الياباني</option>
                                <option value="اليوان الصيني">🇨🇳 اليوان الصيني</option>
                                <option value="الدينار التونسي">🇹🇳 الدينار التونسي</option>
                                <option value="الدرهم المغربي">🇲🇦 الدرهم المغربي</option>
                                <option value="الجنيه المصري">🇪🇬 الجنيه المصري</option>
                            </select>
                        </div>
                        <div class="notif-btn" title="تنبيهات">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                            </svg>
                        </div>
                    </div>
                </div>

                <!-- Main Card (Center) -->
                <div class="main-card">
                    <div class="card-header">
                        <span class="live-indicator"></span>
                        <span class="label">متوسط سعر الصرف المباشر</span>
                    </div>
                    <div class="main-value">
                        <span id="avg" class="value">0.0000</span>
                    </div>
                    <div class="currency-badge">
                        <span id="target-name">الدولار الأمريكي</span>
                        <span id="target-flag">🇺🇸</span>
                    </div>
                </div>

                <!-- Side Cards (Left) -->
                <div class="side-cards">
                    <div class="sub-card">
                        <div class="card-icon blue-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <span class="sub-label">سعر الشراء</span>
                        <div class="sub-value">
                            <span id="buy">0.0000</span>
                        </div>
                    </div>
                    <div class="sub-card">
                        <div class="card-icon gold-icon">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="10"></circle>
                                <line x1="12" y1="8" x2="12" y2="16"></line>
                                <line x1="8" y1="12" x2="16" y2="12"></line>
                            </svg>
                        </div>
                        <span class="sub-label">سعر البيع</span>
                        <div class="sub-value">
                            <span id="sell">0.0000</span>
                        </div>
                    </div>
                </div>

            </div>

            <!-- Footer -->
            <footer class="footer">
                <div class="footer-content">
                    <span id="date" class="date-badge">--</span>
                    <a class="source" href="https://cbl.gov.ly/currency-exchange-rates/">
                        <span class="source">المصدر: مصرف ليبيا المركزي الرسمي</span>
                    </a>
                </div>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>

</html>
